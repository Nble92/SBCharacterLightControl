local char_light_on = true

local function set_char_light(new_intensity)
    ExecuteInGameThread(function()
        for _, l in ipairs(FindAllOf("DirectionalLightComponent") or {}) do
            if l:IsValid() and l:GetFullName():find("CharacterLight", 1, true) then
                l:SetIntensity(new_intensity)   -- NewIntensity: 0 = off, 1 = on
            end
        end
    end)
end

RegisterKeyBindAsync(Key.F9, {}, function()
    char_light_on = not char_light_on
    set_char_light(char_light_on and 1 or 0)
    print("[CameraControl] Character light " .. (char_light_on and "ON (1)" or "OFF (0)"))
end)